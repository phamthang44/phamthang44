<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Phạm Đức Thắng — Full-stack engineer &amp; product builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5b971"/><stop offset="0.5" stop-color="#f08a5d"/><stop offset="1" stop-color="#b56cf0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#f08a5d" stop-opacity="0.28"/><stop offset="1" stop-color="#f08a5d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>
  <style>
    .f{font-family:'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .m{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SFMono-Regular',monospace}
    .in{}
    .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}
    @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .orb{animation:float 9s ease-in-out infinite alternate}
    @keyframes float{to{transform:translate(-24px,14px)}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.in,.orb,.cur{animation:none;opacity:1}}
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <g class="orb" opacity="0.9">
      <circle cx="985" cy="150" r="92" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity=".55"/>
      <circle cx="985" cy="150" r="140" fill="none" stroke="#ffffff" stroke-opacity=".07"/>
      <circle cx="985" cy="150" r="190" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
      <path d="M960 112l-38 38 38 38M1010 112l38 38-38 38M995 102l-20 96" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
      <circle cx="1077" cy="150" r="5" fill="#f5b971"/>
      <circle cx="893" cy="150" r="3" fill="#b56cf0"/>
    </g>
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  </g>
  <g transform="translate(72 0)">
    <text class="m in d1" x="0" y="92" font-size="16" fill="#f5b971" letter-spacing="2">// HELLO, I'M</text>
    <text class="f in d2" x="0" y="160" font-size="60" font-weight="700" fill="#f8fafc" letter-spacing="-1">Phạm Đức Thắng</text>
    <text class="f in d3" x="0" y="206" font-size="24" fill="#cbd5e1">Full-stack engineer <tspan fill="#64748b">·</tspan> I design, build and ship web products.</text>
    <g class="in d4">
      <text class="m" x="0" y="268" font-size="17" fill="#94a3b8"><tspan fill="#f08a5d">❯</tspan> Java · Spring Boot · React · Next.js · Three.js · Rust<tspan class="cur" fill="#f5b971"> ▍</tspan></text>
      <text class="m" x="0" y="300" font-size="15" fill="#64748b">Vietnam  ·  bythang.com</text>
    </g>
  </g>
</svg>
